{% extends "base.html" %}

{% block title %}{% if ingredient %}Edit{% else %}New{% endif %} Ingredient - Dinner Spinner{% endblock %}

{% block content %}
<div class="card">
    <h2>{% if ingredient %}Edit{% else %}New{% endif %} Ingredient</h2>

    <form method="POST">
        <div>
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" value="{{ ingredient.name if ingredient else '' }}" required>
        </div>

        <div class="form-row">
            <div>
                <label for="quantity">Quantity *</label>
                <input type="number" id="quantity" name="quantity" step="0.01" min="0" value="{{ ingredient.quantity if ingredient else 0 }}" required>
            </div>
            <div>
                <label for="unit">Unit *</label>
                <input type="text" id="unit" name="unit" value="{{ ingredient.unit if ingredient else '' }}" required placeholder="e.g. g, kg, ml, l, cup, each">
            </div>
        </div>

        <div>
            <label for="category_id">Category</label>
            <select id="category_id" name="category_id">
                <option value="">— No category —</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if ingredient and ingredient.inventory_category_id == cat.id %}selected{% endif %}>
                    {{ cat.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit">Save</button>
            <a href="{{ url_for('main.ingredients') }}"><button type="button" class="secondary">Cancel</button></a>
        </div>
    </form>
</div>
{% endblock %}
